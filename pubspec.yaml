name: flclash_v2board_client
description: Tianhe Network Desktop Client with Multi-tier Encrypted Routing and Auto Updater.
publish_to: 'none'

version: 3.4.0+140

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0

  # 基礎網路與安全通訊
  http: ^1.2.0
  dio: ^5.4.0

  # AES-256 加解密與雜湊引擎
  encrypt: ^5.0.3
  crypto: ^3.0.3

  # 安全憑證與本地快取
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # 應用程式資訊與檔案路徑
  package_info_plus: ^8.0.0
  path_provider: ^2.1.2

  # 自動更新與外鏈跳轉
  open_filex: ^4.7.0
  url_launcher: ^6.2.4
  webview_flutter: ^4.7.0

  # Mihomo 核心設定檔解析
  yaml: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# 強制鎖定 flutter_secure_storage_macos 到不含 objective_c build hook 的版本
# 原因：3.1.3+ 版本引入 objective_c 依賴，導致 Flutter 3.47.7 Windows 上的
# native assets AOT 編譯器失敗 (recorded_uses.json not generated)
dependency_overrides:
  flutter_secure_storage_macos: 3.1.2
  path_provider_foundation: 2.4.0
