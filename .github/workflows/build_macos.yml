name: Build Tianhe macOS DMG

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS DMG (Apple Silicon & Intel)
    runs-on: macos-latest

    steps:
      - name: 1. 檢出專案程式碼
        uses: actions/checkout@v4

      - name: 2. 設定 Flutter 開發環境
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 3. 檢查 Flutter 與 macOS 構建工具鏈
        run: |
          flutter --version
          flutter doctor -v

      - name: 4. 執行一鍵瘦身編譯與 DMG 封裝腳本
        run: |
          chmod +x ./scripts/build_slim_dmg.sh
          ./scripts/build_slim_dmg.sh

      - name: 5. 🧪 雲端 macOS 自動化冒煙測試與實機登入截圖
        run: |
          echo "安裝 cliclick 桌面 GUI 自動化工具..."
          brew install cliclick || true

          mkdir -p ~/Library/Logs/TianheNetwork
          echo "1. 賦予核心執行權限並啟動 Tianhe.app (注入用戶帳號自動登入)"
          chmod +x dist_mac/Tianhe.app/Contents/Resources/tools/mihomo/mihomo || true

          export TIANHE_AUTO_EMAIL="test17318@outlook.com"
          export TIANHE_AUTO_PASSWORD="a12345678"
          export TIANHE_AUTO_SUBMIT="1"

          # 啟動應用程式二進位
          ./dist_mac/Tianhe.app/Contents/MacOS/Tianhe &
          sleep 4

          echo "2. 截取登入執行畫面"
          screencapture -x 01_login_attempt.png

          echo "3. 使用 cliclick 自動點擊關閉 macOS 系統安全確認視窗 (Allow 按鈕: 596, 473)"
          cliclick c:596,473 || true
          sleep 2

          echo "4. 使用 cliclick 點擊 [Sign In] 登入按鈕 (499, 552)"
          cliclick c:499,552 || true
          sleep 6

          echo "5. 檢查核心進程狀態"
          pgrep -l mihomo || echo "ℹ️ Mihomo 核心待命啟動中"

          echo "6. 自動截取 macOS 桌面實機畫面 (主控台與驗證畫面)"
          screencapture -x mac_verification.png
          screencapture -x 02_dashboard_screen.png

          echo "7. 自動操作儀表板並截圖"
          cliclick c:450,280 || true
          sleep 2
          screencapture -x 03_dashboard_detail.png

      - name: 6. 📤 上傳 Mac 實機畫面與測試日誌
        uses: actions/upload-artifact@v4
        with:
          name: mac-verification-evidence
          path: |
            mac_verification.png
            01_login_attempt.png
            02_dashboard_screen.png
            03_dashboard_detail.png
            ~/Library/Logs/TianheNetwork/
          if-no-files-found: warn

      - name: 7. 上傳 macOS DMG 建構產物
        uses: actions/upload-artifact@v4
        with:
          name: TianheNetwork_v3.0.8_macOS
          path: dist_mac/TianheNetwork_v3.0.8_macOS.dmg
          if-no-files-found: error

      - name: 8. 自動發布 Release (若觸發 tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist_mac/TianheNetwork_v3.0.8_macOS.dmg
          name: Tianhe Network macOS Client ${{ github.ref_name }}
          body: |
            ## 🍎 天河網絡 (Tianhe Network) macOS 旗艦版
            - 版本：${{ github.ref_name }}
            - 支援架構：Apple Silicon (M1/M2/M3/M4) + Intel (x86_64) 通用 Universal
            - 核心引擎：Mihomo Meta + macOS 原生 networksetup 系統代理控制
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
