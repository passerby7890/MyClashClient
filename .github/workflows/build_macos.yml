name: Build Tianhe macOS DMG

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS DMG (Apple Silicon & Intel)
    runs-on: macos-14

    steps:
      - name: "1. 檢出專案程式碼"
        uses: actions/checkout@v4

      - name: "2. 設定 Flutter 開發環境"
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: "3. 檢查 Flutter 與 macOS 構建工具鏈"
        run: |
          flutter --version
          flutter doctor -v

      - name: "4. 執行一鍵瘦身編譯與 DMG 封裝腳本"
        run: |
          chmod +x ./scripts/build_slim_dmg.sh
          ./scripts/build_slim_dmg.sh

      - name: "5. 🧪 Step A: 執行 macOS 雲端 30 項硬核底層與核心驗收矩陣"
        run: |
          python3 ./scripts/macos_cloud_acceptance.py

      - name: "6. 🎨 Step B: 執行 8 大 Bento 分頁 × 4 國語言無視覺溢出測試"
        run: |
          flutter test test/macos_visual_acceptance_test.dart

      - name: "6.5 ⚡ Step B.5: 執行 Happy Eyeballs 零感容災與混沌競速驗收測試"
        run: |
          flutter test test/happy_eyeballs_failover_test.dart

      - name: "7. 🚀 Step C: 真機掛載啟動、8 大分頁巡檢與真實代理連線實測"
        run: |
          echo "安裝 cliclick 桌面 GUI 自動化工具..."
          brew install cliclick || true

          mkdir -p audit_screenshots
          mkdir -p ~/Library/Logs/TianheNetwork
          chmod +x dist_mac/Tianhe.app/Contents/Resources/tools/mihomo/mihomo || true

          export TIANHE_AUTO_EMAIL="test17318@outlook.com"
          export TIANHE_AUTO_PASSWORD="a12345678"
          export TIANHE_AUTO_SUBMIT="1"

          # 啟動應用程式二進位
          ./dist_mac/Tianhe.app/Contents/MacOS/Tianhe &
          sleep 4

          echo "截取登入畫面"
          screencapture -x audit_screenshots/00_login_screen.png

          echo "自動點擊關閉 macOS 系統安全確認視窗"
          osascript -e 'tell application "System Events" to key code 48' 2>/dev/null || true
          osascript -e 'tell application "System Events" to key code 49' 2>/dev/null || true
          osascript -e 'tell application "System Events" to key code 36' 2>/dev/null || true
          cliclick c:596,473 || true
          sleep 2

          echo "點擊 [Sign In] 登入按鈕"
          cliclick c:499,552 || true
          sleep 6

          echo "進入主控台 (Tab 0: Home)"
          screencapture -x audit_screenshots/00_home.png

          echo "點擊加速連線按鈕"
          cliclick c:650,350 || true
          sleep 4
          screencapture -x audit_screenshots/00_home_connected.png

          echo "=== 🧪 驗證真實代理端口與連線 ==="
          lsof -i :7890 || true
          lsof -i :9090 || true
          curl -I -s -m 8 -x http://127.0.0.1:7890 http://connectivitycheck.gstatic.com/generate_204 > audit_screenshots/proxy_test_204.txt || true
          curl -I -s -m 8 -x http://127.0.0.1:7890 https://www.google.com > audit_screenshots/proxy_test_google.txt || true
          cat audit_screenshots/proxy_test_204.txt || true

          echo "巡檢 Tab 1: 購買套餐 (Store)"
          cliclick c:100,125 || true
          sleep 2
          screencapture -x audit_screenshots/01_store.png

          echo "巡檢 Tab 2: 節點狀態 (Nodes)"
          cliclick c:100,165 || true
          sleep 2
          screencapture -x audit_screenshots/02_nodes.png

          echo "巡檢 Tab 3: 實時連接 (Connections)"
          cliclick c:100,205 || true
          sleep 2
          screencapture -x audit_screenshots/03_connections.png

          echo "巡檢 Tab 4: 流量詳情 (Traffic)"
          cliclick c:100,245 || true
          sleep 2
          screencapture -x audit_screenshots/04_traffic.png

          echo "巡檢 Tab 5: 邀請推廣 (Affiliate)"
          cliclick c:100,285 || true
          sleep 2
          screencapture -x audit_screenshots/05_affiliate.png

          echo "巡檢 Tab 6: 個人中心 (Profile)"
          cliclick c:100,325 || true
          sleep 2
          screencapture -x audit_screenshots/06_profile.png

          echo "巡檢 Tab 7: 高級設置 (Settings)"
          cliclick c:100,365 || true
          sleep 2
          screencapture -x audit_screenshots/07_settings.png

          echo "返回 Tab 0: 加速主頁 (Home Return)"
          cliclick c:100,85 || true
          sleep 2
          screencapture -x audit_screenshots/08_home_return.png

          echo "檢查系統崩潰日誌"
          ls -la ~/Library/Logs/DiagnosticReports/ 2>/dev/null || true

      - name: "8. 📤 上傳 macOS 30 項驗收報告、全分頁實機截圖與日誌"
        uses: actions/upload-artifact@v4
        with:
          name: mac-acceptance-evidence
          path: |
            mac_acceptance_report.json
            audit_screenshots/
            ~/Library/Logs/TianheNetwork/
          if-no-files-found: warn

      - name: "9. 💿 上傳 macOS DMG 建構產物"
        uses: actions/upload-artifact@v4
        with:
          name: TianheNetwork_v3.0.8_macOS
          path: dist_mac/TianheNetwork_v3.0.8_macOS.dmg
          if-no-files-found: error

      - name: "10. 🏷️ 自動發布 Release (若觸發 tag)"
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist_mac/TianheNetwork_v3.0.8_macOS.dmg
          name: Tianhe Network macOS Client ${{ github.ref_name }}
          body: |
            ## 🍎 天河網絡 (Tianhe Network) macOS 旗艦版
            - 版本：${{ github.ref_name }}
            - 支援架構：Apple Silicon (M1/M2/M3/M4) + Intel (x86_64) 通用 Universal
            - 核心引擎：Mihomo Meta + macOS 原生 networksetup 系統代理控制
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
